global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: checkout-service
    static_configs:
      - targets: ["checkout-service:8001"]

  - job_name: cart-service
    static_configs:
      - targets: ["cart-service:8002"]

  - job_name: pricing-service
    static_configs:
      - targets: ["pricing-service:8003"]

  - job_name: payment-service
    static_configs:
      - targets: ["payment-service:8004"]

  - job_name: incident-controller
    static_configs:
      - targets: ["incident-controller:8000"]

  - job_name: load-generator
    static_configs:
      - targets: ["load-generator:8005"]
